<!DOCTYPE html>
<html>
    <head>
        <title> - MCSR Ranked</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: rgb(0, 0, 0);
                color: white;
            }

            #searchc {
                width: 95%;
                height: 50px;
                margin: 10px auto;
                display: flex;
                justify-content: center;
            }

            #search {
                width: 100%;
                max-width: 100%;
                height: 100%;
                max-height: 50px;
                background-color: black;
                color: white;
                text-align: center;
                border: 2px solid rgb(1, 1, 76);
                border-radius: 10px;
                font-size: 40px;
            }

            #data {
                display: grid;
                grid-template-columns: 2.5fr 1fr 2.5fr;
                width: 100%;
                height: calc(100vh - 70px);
            }

            #dl, #dm, #dr {
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: rgb(12, 8, 41);
                margin: 10px;
            }
            
            #dl, #dm {
                flex-direction: column;
            }

            #playerModel {
                max-width: 100%;
                max-height: 400px;
            }
            #socials {
            }
        </style>
    </head>

    <body>
        <div id="searchc">
            <form id="searchform" style="width: 100%;">
                <input id="search"/>
            </form>
        </div>

        <div id="data">
            <div id="dl">
                <p>pb:6767</p>
                <p>pb:6767</p>
            </div>

            <div id="dm">
                <img id="playerModel" src=""/>
                <div id="socials"></div>
            </div>

            <div id="dr">
                <p>elo ^^^^</p>
            </div>
        </div>
    </body>

<script>
    function copytoclip(x) {
        navigator.clipboard.writeText(x);
    }

    function buildSocials(dc, yt, tw) {
        const socials = document.getElementById('socials')
        if (dc) {
            const dcicon = document.createElement('img')
            dcicon.id = 'dc'
            dcicon.src = 'https://support.discord.com/hc/user_images/bbW4u80g7yIVxsphv9diNw.png'
            dcicon.height = 30
            dcicon.width = 30
            dcicon.onclick = 'copytoclip('+dc+')'
            socials.appendChild(dcicon)
        }
    }

    function getUserSearched() {
        const params = new URLSearchParams(document.location.search)
        const u = params.get('u')
        document.title = (u ? u : '') + ' - MCSR Ranked'
        return u
    }

    function loadUser(user) {
        const playerModel = document.getElementById('playerModel')
        playerModel.src = 'https://nmsr.nickac.dev/fullbody/' + user

        const search = document.getElementById('search')
        search.value = user || ''
    }

    const form = document.getElementById('searchform')
    const search = document.getElementById('search')

    form.addEventListener('submit', function (e) {
        e.preventDefault()

        const value = search.value.trim()
        if (!value) {
            const search = document.getElementById('search')
            search.value = new URLSearchParams(document.location.search).get('u')
            return
        }

        const url = new URL(window.location.href)
        url.searchParams.set('u', value)

        window.location.href = url.toString()
    })

    const user = getUserSearched()
    loadUser(user)
</script>
</html>
