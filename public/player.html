<!DOCTYPE html>
<html>
    <head>
        <title> - MCSR Ranked</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: rgb(0, 0, 0);
                color: white;
            }

            #searchc {
                width: 95%;
                height: 50px;
                margin: 10px auto;
                display: flex;
                justify-content: center;
            }

            #search {
                width: 100%;
                max-width: 100%;
                height: 100%;
                max-height: 50px;
                background-color: black;
                color: white;
                text-align: center;
                border: 2px solid rgb(1, 1, 76);
                border-radius: 10px;
                font-size: 40px;
            }

            #data {
                display: grid;
                grid-template-columns: 2.5fr 1fr 2.5fr;
                width: 100%;
                height: calc(100vh - 70px);
            }

            #dl, #dm, #dr {
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: rgb(12, 8, 41);
                margin: 10px;
                border: 1px solid rgb(1, 1, 76);
                border-radius: 5px;
            }
            
            #dl, #dm {
                flex-direction: column;
            }

            #dl {
                font-weight: 600;
                position: relative;
            }

            #playerModel {
                max-width: 100%;
                max-height: 400px;
            }
            #socials {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #dc, #tw, #yt {
                padding: 5px;
            }
            .peakdiv {
                display: flex;
                align-items: center;
                border-radius: 5px;
                height: 18px;
                background-image: linear-gradient(to right, rgb(255, 0, 0), rgb(255, 200, 0));
                padding: 5px;
                width: fit-content;
                margin-left: 5px;
            }
            .elodiv {
                display: flex;
                align-items: center;
            }
            #matchPuller {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                background-color: rgb(48, 48, 48);
                text-align: center;
                border-top: 1px solid rgb(1, 1, 76);
                border-top-left-radius: 5px;
                border-top-right-radius: 5px;
                cursor: grab;
                z-index: 1;
                top: 92%;
            }
            #elograph {
                width: 100%;
                height: 100%;
            }
            @keyframes grabAnimation {
                0% { top: 90%; }
                100% { top: 10px; }
            }
        </style>
    </head>

    <body>
        <div id="searchc">
            <form id="searchform" style="width: 100%;">
                <input id="search"/>
            </form>
        </div>

        <div id="data">
            <div id="dl">
                <div id="matchPuller" onclick="toggleMatches()">
                    <div id="grabme">
                        <p style="margin: 0; transform: translateY(10px);">Matches</p>
                        <p style="margin: 0;" class="grabbar">__________</p>
                        <p style='margin: 0; margin-bottom: 10px; transform: translateY(-3px);' class="grabbar">________</p>
                    </div>
                </div>
            </div>

            <div id="dm">
                <img id="playerModel" src=""/>
                <div id="socials"></div>
            </div>

            <div id="dr">
                <div id="elograph"></div>
                <!-- <button id="showall">Show All</button> -->
            </div>
        </div>
    </body>

<script>
    function copytoclip(x) {
        navigator.clipboard.writeText(x);
    }
    var matchesOpen = false
    function toggleMatches() {
        if (matchesOpen) {
            const matchPuller = document.getElementById('matchPuller')
            matchPuller.style.animation = 'grabAnimation 0.5s reverse'
            setTimeout(() => {
                matchPuller.style.animation = ''
                matchPuller.style.top = '92%'
            }, 490)
        } else {
            const matchPuller = document.getElementById('matchPuller')
            matchPuller.style.animation = 'grabAnimation 0.5s'
            setTimeout(() => {
                matchPuller.style.animation = ''
                matchPuller.style.top = '10px'
            }, 490)
        }
        matchesOpen = !matchesOpen

    }

    function dccopy(dc) {
        copytoclip(dc)
        const img = document.getElementById('dc')
        img.src = '/copy.png'
        setTimeout(() => {img.src = '/discord.png'}, 1000)
    }

    function buildSocials(dc, yt, tw) {
        const socials = document.getElementById('socials')
        if (dc) {
            const dcicon = document.createElement('img')
            dcicon.id = 'dc'
            dcicon.src = '/discord.png'
            dcicon.height = 30
            dcicon.width = 30
            dcicon.onclick = () => dccopy(dc)
            socials.appendChild(dcicon)
        }
        if (tw) {
            const twicon = document.createElement('img')
            twicon.id = 'tw'
            twicon.src = '/twitch.png'
            twicon.height = 30
            twicon.width = 30
            twicon.onclick = () => window.open('https://twitch.tv/' + tw, '_blank');
            socials.appendChild(twicon)
        }
        if (yt) {
            const yticon = document.createElement('img')
            yticon.id = 'yt'
            yticon.src = '/yt.png'
            // yticon.height = 30
            yticon.width = 30
            yticon.onclick = () => window.open('https://youtube.com/channel/' + yt, '_blank');
            socials.appendChild(yticon)
        }
    }

    function getUserSearched() {
        const path = window.location.pathname.split('/')
        const user = path[path.length - 1]
        document.title = (user || '') + ' - MCSR Ranked'
        return user || null
    }

    async function loadUserData(data, season = true, casual = false) {
        const stats = season ? data.statistics.season : data.statistics.total;

        var pb = casual ? stats.bestTime.casual : stats.bestTime.ranked;
        var compT = casual ? stats.completionTime.casual : stats.completionTime.ranked;
        var elo = data.eloRate;
        var lbpos = data.eloRank;
        var lastOnline = data.timestamp.lastOnline;
        var lastRanked = data.timestamp.lastRanked;
        var nextDecay = data.timestamp.nextDecay;
        var playtime = casual ? stats.playtime.casual : stats.playtime.ranked;
        var ffs = casual ? stats.forfeits.casual : stats.forfeits.ranked;
        var hwinstr = casual ? stats.highestWinStreak.casual : stats.highestWinStreak.ranked;
        var cwinstr = casual ? stats.currentWinStreak.casual : stats.currentWinStreak.ranked;
        var matchN = casual ? stats.playedMatches.casual : stats.playedMatches.ranked;
        var compl = casual ? stats.completions.casual : stats.completions.ranked;
        var avg = compT / compl
        var winsN = casual ? stats.wins.casual : stats.wins.ranked;
        var lossN = casual ? stats.loses.casual : stats.loses.ranked;
        var helo = data.seasonResult.highest
        var lelo = data.seasonResult.lowest
        var phase = data.seasonResult.last.phasePoint

        const left = document.getElementById('dl')
        const cont = document.createElement('div')

        
        const ed = document.createElement('div')
        ed.className = 'elodiv'
        ed.appendChild(newP(elotorank(elo) + ' - ' + elo + ' ( #' + lbpos + ' )'))
        if (helo == elo && elo != null) {
            const pd = document.createElement('div')
            pd.className = 'peakdiv'
            const txt = newP('PEAK')
            txt.style.margin = 0
            pd.appendChild(txt)
            const img = document.createElement('img')
            img.src = '/fire3D.webp'
            img.height = 26
            img.style.marginLeft = '5px'
            pd.appendChild(img)
            ed.appendChild(pd)
        }
        cont.appendChild(ed)

        pb = formatTime(pb)
        cont.appendChild(newP('PB: ' + pb))
        cont.appendChild(newP('Average: ' + formatTime(Math.round(avg))))
        var d = new Date(0)
        d.setUTCSeconds(lastOnline)
        cont.appendChild(newP('Last Online: ' + d.toLocaleString()))
        d = new Date(0)
        d.setUTCSeconds(lastRanked)
        cont.appendChild(newP('Last Queue: ' + d.toLocaleString()))
        if (nextDecay) {
            d = new Date(0)
            d.setUTCSeconds(nextDecay)
            cont.appendChild(newP('Next Decay: ' + d.toLocaleString()))
        }
        cont.appendChild(newP('Playtime: ' + Math.round(playtime/1000/60/60) + ':' + Math.round((playtime/1000/60)%60) + ':' + Math.round((playtime/1000)%60)))
        cont.appendChild(newP('FF: ' + Math.round((ffs/matchN)*1000)/10 + '%'))
        left.appendChild(cont)
    }

    function newP(text, id = null) {
        const p = document.createElement('p')
        p.innerText = text
        p.id = id
        return p
    }

var rankeddata = null

    async function loadUser(user) {
        const search = document.getElementById('search')
        search.value = user || ''

        const rankedraw = await fetch('/api/player/' + user)
        const rankedjs = await rankedraw.json()
        const rankeddata = rankedjs['data']
        if (rankeddata['error'] == 'User is not exists.') {
            const dl = document.getElementById('dl')
            dl.innerHTML = '<p>User does not exist</p>'
            return
        }

        const discord = rankeddata.connections?.discord?.name || ''
        const yt = rankeddata.connections?.youtube?.id || ''
        const tw = rankeddata.connections?.twitch?.name || ''

        buildSocials(discord, yt, tw)

        const playerModel = document.getElementById('playerModel')
        playerModel.src = 'https://nmsr.nickac.dev/fullbody/' + user
        loadUserData(rankeddata)
        loadUserEloGraph(rankeddata)
    }
    
var allmatches = null
var elocchanges = null

    async function loadUserEloGraph(data, max = 30) {
        const ign = data['nickname']
        const uuid = data['uuid']
        const condiv = document.getElementById('elograph')
        const matchesRaw = await fetch('/api/matches/' + ign)
        const matches = await matchesRaw.json()
        allmatches = matches

        const changes = []
        let current = 0
        const orderedMatches = Array.isArray(matches) ? [...matches].reverse() : []

        for (const match of orderedMatches) {
            const changeEntry = (match.changes || []).find(c => c.uuid === uuid)
            if (changeEntry && typeof changeEntry.change === 'number') {
                current += changeEntry.change
                changes.push(current)
            }
        }

        const finalElo = typeof data.eloRate === 'number' ? data.eloRate : 0
        const actualElos = changes.map((value, index) => {
            const total = changes[changes.length - 1]
            return finalElo - (total - value)
        })

        elocchanges = actualElos
        drawEloGraph(actualElos)
    }

    function drawEloGraph(lst) {
        const condiv = document.getElementById('elograph')
        condiv.innerHTML = ''

        const rect = condiv.getBoundingClientRect()
        const width = rect.width
        const height = rect.height
        const padding = 20

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        svg.setAttribute('width', width)
        svg.setAttribute('height', height)
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`)
        svg.style.width = '100%'
        svg.style.height = '100%'
        svg.style.display = 'block'
        condiv.appendChild(svg)

        if (lst.length === 0) {
            return
        }

        const rawMin = Math.min(...lst)
        const rawMax = Math.max(...lst)
        const minValue = Math.max(0, rawMin - 150)
        const maxValue = Math.min(3000, rawMax + 150)
        const range = Math.max(maxValue - minValue, 1)
        const effectiveHeight = height - padding * 2
        const yForValue = value => height - padding - ((value - minValue) / range) * effectiveHeight
        const stepX = width / Math.max(lst.length - 1, 1)

        const points = lst.map((value, index) => {
            const x = index * stepX
            const y = yForValue(Math.max(0, Math.min(3000, value)))
            return { x, y, value }
        })

        for (let i = 1; i < points.length; i++) {
            const prev = points[i - 1]
            const current = points[i]
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line')
            line.setAttribute('x1', prev.x.toFixed(2))
            line.setAttribute('y1', prev.y.toFixed(2))
            line.setAttribute('x2', current.x.toFixed(2))
            line.setAttribute('y2', current.y.toFixed(2))
            line.setAttribute('stroke', elotocolor(current.value))
            line.setAttribute('stroke-width', 2)
            line.setAttribute('stroke-linecap', 'round')
            svg.appendChild(line)
        }
    }
    function elotocolor(elo) {
        const rank = elotorank(elo)
        if (rank === 'Netherite') {
            return '#d066ff'
        } else if (rank.includes('Diamond')) {
            return '#29c9c2'
        } else if (rank.includes('Emerald')) {
            return '#21a83b'
        } else if (rank.includes('Gold')) {
            return '#d2a20a'
        } else if (rank.includes('Iron')) {
            return '#e2e2e2'
        } else { return '#aaaaaa'}
    }
    function elotorank(elo) {
        if (elo >= 2000) {
            return 'Netherite'
        } else if (elo >= 1800) {
            return 'Diamond III'
        } else if (elo >= 1650) {
            return 'Diamond II'
        } else if (elo >= 1500) {
            return 'Diamond I'
        } else if (elo >= 1400) {
            return 'Emerald III'
        } else if (elo >= 1300) {
            return 'Emerald II'
        } else if (elo >= 1200) {
            return 'Emerald I'
        } else if (elo >= 1100) {
            return 'Gold III'
        } else if (elo >= 1000) {
            return 'Gold II'
        } else if (elo >= 900) {
            return 'Gold I'
        } else if (elo >= 800) {
            return 'Iron III'
        } else if (elo >= 700) {
            return 'Iron II'
        } else if (elo >= 600) {
            return 'Iron I'
        } else if (elo >= 500) {
            return 'Coal III'
        } else if (elo >= 400) {
            return 'Coal II'
        } else if (elo >= 0) {
            return 'Coal I'
        } else {
            return 'Unranked'
        }
    }

    function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000)

        const minutes = Math.floor(totalSeconds / 60)
        const seconds = totalSeconds % 60
        const milliseconds = ms % 1000

        const mm = String(minutes).padStart(2, '0')
        const ss = String(seconds).padStart(2, '0')
        const mmm = String(milliseconds).padStart(3, '0')

        return `${mm}:${ss}.${mmm}`
    }

    async function getPlayerAverage(name, uuid) {
        let match_times = []
        let before = null

        while (true) {
            let url = `https://api.mcsrranked.com/users/${encodeURIComponent(name)}/matches/?count=100&type=2&sort=oldest`
            if (before !== null) {
                url += `&before=${before}`
            }

            const raw = await fetch(url)
            const json = await raw.json()

            if (json['status'] !== 'success') {
                console.log('error')
                return
            }

            const data = json['data']

            if (data.length === 0) {
                break
            }

            for (const match of data) {
                if (match['decayed'] || match['forfeited']) {
                    continue
                }

                if (match['result'] && match['result']['uuid'] === uuid) {
                    match_times.push(match['result']['time'])
                }

                before = match['id']
            }

            if (data.length < 100) {
                break
            }
        }

        if (match_times.length === 0) {
            return '00:00.000'
        }

        let sum = 0
        for (const time of match_times) {
            sum += time
        }

        const rawav = sum / match_times.length
        const rndav = Math.floor(rawav)
        return formatTime(rndav)
    }

    const form = document.getElementById('searchform')
    const search = document.getElementById('search')

    form.addEventListener('submit', function (e) {
        e.preventDefault()

        const value = search.value.trim()
        if (!value) {
            const search = document.getElementById('search')
            search.value = getUserSearched()
            return
        }
        
        window.location.href = '/player/' + value
    })

    const user = getUserSearched()
    loadUser(user)
</script>
</html>
