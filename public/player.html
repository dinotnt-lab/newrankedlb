<!DOCTYPE html>
<html>
    <head>
        <title> - MCSR Ranked</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: rgb(0, 0, 0);
                color: white;
            }

            #searchc {
                width: 95%;
                height: 50px;
                margin: 10px auto;
                display: flex;
                justify-content: center;
            }

            #search {
                width: 100%;
                max-width: 100%;
                height: 100%;
                max-height: 50px;
                background-color: black;
                color: white;
                text-align: center;
                border: 2px solid rgb(1, 1, 76);
                border-radius: 10px;
                font-size: 40px;
            }

            #data {
                display: grid;
                grid-template-columns: 2.5fr 1fr 2.5fr;
                width: 100%;
                height: calc(100vh - 70px);
            }

            #dl, #dm, #dr {
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: rgb(12, 8, 41);
                margin: 10px;
            }
            
            #dl, #dm {
                flex-direction: column;
            }

            #playerModel {
                max-width: 100%;
                max-height: 400px;
            }
            #socials {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #dc, #tw, #yt {
                padding: 5px;
            }
        </style>
    </head>

    <body>
        <div id="searchc">
            <form id="searchform" style="width: 100%;">
                <input id="search"/>
            </form>
        </div>

        <div id="data">
            <div id="dl">
                <p>pb:6767</p>
                <p>pb:6767</p>
            </div>

            <div id="dm">
                <img id="playerModel" src=""/>
                <div id="socials"></div>
            </div>

            <div id="dr">
                <p>elo ^^^^</p>
            </div>
        </div>
    </body>

<script>
    function copytoclip(x) {
        navigator.clipboard.writeText(x);
    }
    function dccopy(dc) {
        copytoclip(dc)
        const img = document.getElementById('dc')
        img.src = '/copy.png'
        setTimeout(() => {img.src = '/discord.png'}, 1000)
    }

    function buildSocials(dc, yt, tw) {
        const socials = document.getElementById('socials')
        if (dc) {
            const dcicon = document.createElement('img')
            dcicon.id = 'dc'
            dcicon.src = '/discord.png'
            dcicon.height = 30
            dcicon.width = 30
            dcicon.onclick = () => dccopy(dc)
            socials.appendChild(dcicon)
        }
        if (tw) {
            const twicon = document.createElement('img')
            twicon.id = 'tw'
            twicon.src = '/twitch.png'
            twicon.height = 30
            twicon.width = 30
            twicon.onclick = () => window.location.href = 'https://twitch.tv/' + tw
            socials.appendChild(twicon)
        }
        if (yt) {
            const yticon = document.createElement('img')
            yticon.id = 'yt'
            yticon.src = '/yt.png'
            // yticon.height = 30
            yticon.width = 30
            yticon.onclick = () => window.location.href = 'https://youtube.com/' + yt
            socials.appendChild(yticon)
        }
    }

    function getUserSearched() {
        const path = window.location.pathname.split('/')
        const user = path[path.length - 1]
        document.title = (user || '') + ' - MCSR Ranked'
        return user || null
    }

    async function loadUser(user) {
        const rankedraw = await fetch('/api/player/' + user)
        const rankedjs = await rankedraw.json()
        const rankeddata = rankedjs['data']
        if (rankeddata['error'] == 'User is not exists.') {
            const dl = document.getElementById('dl')
            dl.innerHTML = '<p>User does not exist</p>'
            return
        }

        const discord = rankeddata.connections?.discord?.name || ''
        const yt = rankeddata.connections?.youtube?.name || ''
        const tw = rankeddata.connections?.twitch?.name || ''

        buildSocials(discord, yt, tw)
        console.log(rankeddata)

        const playerModel = document.getElementById('playerModel')
        playerModel.src = 'https://nmsr.nickac.dev/fullbody/' + user

        const search = document.getElementById('search')
        search.value = user || ''
    }

    const form = document.getElementById('searchform')
    const search = document.getElementById('search')

    form.addEventListener('submit', function (e) {
        e.preventDefault()

        const value = search.value.trim()
        if (!value) {
            const search = document.getElementById('search')
            search.value = getUserSearched()
            return
        }
        
        window.location.href = '/player/' + value
    })

    const user = getUserSearched()
    loadUser(user)
</script>
</html>
